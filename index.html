<!DOCTYPE html>
<html lang="en" id="root">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>35 IRIS</title>
<meta name="theme-color" content="#0b0418"/>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<style>
:root{--bg:#05010c;--ink:#f5f7ff;--dim:#b9b6d3;--p:#9945ff;--g:#14f195;--c:#19fbff;--l:rgba(153,69,255,.28);--card:rgba(20,6,39,.72)}
*{box-sizing:border-box;margin:0;padding:0}html,body{background:var(--bg);color:var(--ink)}
body{font-family:ui-sans-serif,system-ui,sans-serif;line-height:1.55}
[dir=rtl] body{font-family:ui-sans-serif,system-ui,"Segoe UI",Tahoma,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 88px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.signs{letter-spacing:.14em;font-size:18px;color:var(--dim)}
.langs{display:flex;gap:6px}
.langs button{border:1px solid var(--l);background:transparent;color:var(--dim);border-radius:999px;padding:6px 10px;font:700 11px inherit;letter-spacing:.12em;cursor:pointer}
.langs button.on{color:#04110a;background:var(--g);border-color:var(--g)}
.hero{margin:0 0 12px;border-radius:22px;overflow:hidden;border:1px solid var(--l);background:#05010c}
.hero img{width:100%;height:auto;display:block}
.lede,.hint,.love{color:var(--dim);font-size:15px}
.love{margin-top:28px;font-size:16px;line-height:1.7;color:#e8e6f6}
h2{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--p);margin:22px 2px 8px}
.askgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.askgrid button{text-align:start;border:1px solid var(--l);background:var(--card);color:var(--ink);border-radius:14px;padding:12px;font:600 13px inherit;cursor:pointer}
.askgrid button small{display:block;color:var(--dim);font-weight:500;margin-top:4px}
.pics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
.pic{border:1px solid var(--l);border-radius:14px;padding:10px 8px;background:linear-gradient(180deg,rgba(153,69,255,.16),transparent)}
.pic b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--g);margin-bottom:4px}
.pic span{color:var(--dim);font-size:12px}
.tabs{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}
.tabs button{flex:1;min-width:22%;border:1px solid var(--l);background:transparent;color:var(--ink);border-radius:999px;padding:10px 8px;font:600 13px inherit;cursor:pointer}
.tabs button.on{background:var(--g);color:#04110a;border-color:var(--g)}
.panel{display:none}.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--l);border-radius:16px;padding:16px;margin-top:12px}
.q{font-size:16px;margin-bottom:10px}
.ans{display:flex;flex-wrap:wrap;gap:8px}
.ans button{border:1px solid var(--l);background:#11041f;color:var(--ink);border-radius:999px;padding:8px 12px;font:600 13px inherit;cursor:pointer}
.ans button.on-no{border-color:var(--g);color:var(--g)}
.ans button.on-yes{border-color:#ff6b8a;color:#ff6b8a}
.ans button.on-idk{border-color:#f5d76e;color:#f5d76e}
.badge{display:inline-block;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;letter-spacing:.1em;margin-bottom:8px}
.A{color:#14f195}.B{color:#f5d76e}.C{color:#ff6b8a}
.rule{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;white-space:pre-wrap}
label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--p);margin-bottom:8px}
textarea{width:100%;min-height:72px;background:#11041f;color:var(--ink);border:1px solid var(--l);border-radius:12px;padding:12px;font:14px inherit}
#q{font:13px ui-monospace,Menlo,Consolas,monospace;min-height:88px}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.go{background:var(--g);color:#04110a;border:0;border-radius:999px;padding:10px 14px;font:600 13px inherit;cursor:pointer}
.ghost{background:transparent;border:1px solid var(--l);color:var(--ink);border-radius:999px;padding:10px 14px;font:600 13px inherit;cursor:pointer}
.out{display:none;margin-top:12px}.out.on{display:block}
footer{margin-top:16px;color:var(--dim);font-size:14px}
a{color:var(--c)}
.path{color:var(--g);font-size:12px;margin-bottom:6px}
@media(max-width:560px){.pics{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <p class="signs">✝️ 🧿 🪬 · 💡 🦅</p>
    <div class="langs">
      <button type="button" id="lang-en" class="on">EN</button>
      <button type="button" id="lang-ar">AR</button>
    </div>
  </div>
  <div class="hero"><img src="https://35.elghaly.dev/IMG_5183.jpeg" alt="35 ELGHALY"/></div>
  <p class="lede" data-en="Not a normal site. First pass free. No account. Nothing sent to us." data-ar="ليس موقعاً عادياً. المرور الأول مجاني. بلا حساب. لا شيء يُرسل إلينا."></p>
  <div class="pics">
    <div class="pic"><b data-en="Look" data-ar="انظر"></b><span data-en="Open the path on YOUR glass." data-ar="افتح المسار على زجاجك."></span></div>
    <div class="pic"><b data-en="Tap" data-ar="اضغط"></b><span data-en="The page answers." data-ar="الصفحة تجيب."></span></div>
    <div class="pic"><b data-en="Earn" data-ar="اكسب"></b><span data-en="Help people you trust after you can do this." data-ar="ساعد من تثق بهم بعد أن تتعلم."></span></div>
  </div>
  <p class="hint" id="ai-line" data-en="What happened?" data-ar="ماذا حدث؟"></p>
  <div class="askgrid">
    <button type="button" data-go="iphone"><span data-en="Someone wants an app on my phone" data-ar="شخص يريد تطبيقاً على هاتفي"></span><small data-en="iPhone / Android settings" data-ar="إعدادات الآيفون / أندرويد"></small></button>
    <button type="button" data-go="iphone"><span data-en="Unknown device on my account" data-ar="جهاز مجهول على حسابي"></span><small data-en="Apple ID or Google devices" data-ar="أجهزة Apple أو Google"></small></button>
    <button type="button" data-go="sig"><span data-en="I signed or sent crypto" data-ar="وقَّعت أو أرسلت عملة"></span><small data-en="SOL / BTC / ETH public hash" data-ar="توقيع عام SOL / BTC / ETH"></small></button>
    <button type="button" data-go="sig"><span data-en="They said connect wallet" data-ar="قالوا اربط المحفظة"></span><small data-en="Do not connect. Paste the hash" data-ar="لا تربط. الصق التوقيع فقط"></small></button>
  </div>
  <div class="tabs">
    <button type="button" id="tab-iphone" class="on">iPhone</button>
    <button type="button" id="tab-android">Android</button>
    <button type="button" id="tab-sig">SOL / BTC / ETH</button>
  </div>
  <div id="iphone" class="panel on"></div>
  <div id="android" class="panel"></div>
  <div id="sig" class="panel">
    <div class="card">
      <label for="q" data-en="Public hash only" data-ar="توقيع عام فقط"></label>
      <textarea id="q" spellcheck="false" autocomplete="off" placeholder="SOL / BTC / ETH"></textarea>
      <div class="row">
        <button class="go" id="run" type="button">Classify</button>
        <button class="ghost" id="clr" type="button">Clear</button>
      </div>
      <div class="out" id="out"><p><span class="badge A" id="badge">-</span></p><p class="rule" id="report"></p></div>
    </div>
  </div>
  <h2 data-en="Ask IRIS" data-ar="اسأل IRIS"></h2>
  <div class="card">
    <p class="hint" data-en="After you looked. Instant answer. Nothing stored on a server." data-ar="بعد أن ترى. إجابة فورية. لا شيء على خادم."></p>
    <textarea id="askq" placeholder="Ask IRIS"></textarea>
    <div class="row"><button class="go" type="button" id="askgo">Answer</button></div>
    <div class="out" id="askout"><p class="rule" id="askrep"></p></div>
  </div>
  <p class="love" data-en="See first. Protect the people you love. Teach them to see, without taking their phone." data-ar="أبصر أولاً. احمِ من تحب. علِّمهم أن يروا، من غير أن تأخذ هاتفهم."></p>
  <footer><a href="mailto:support@elghaly.dev">support@elghaly.dev</a></footer>
</div>
<script src="app.js"></script>
<script>
var LANG=localStorage.getItem("35-iris-lang")||"en";
function applyLang(l){
  LANG=l; localStorage.setItem("35-iris-lang",l);
  document.getElementById("root").lang=l;
  document.getElementById("root").dir=l==="ar"?"rtl":"ltr";
  document.getElementById("lang-en").classList.toggle("on",l==="en");
  document.getElementById("lang-ar").classList.toggle("on",l==="ar");
  document.querySelectorAll("[data-en]").forEach(function(n){n.textContent=n.getAttribute("data-"+l)||n.getAttribute("data-en");});
}
document.getElementById("lang-en").onclick=function(){applyLang("en");};
document.getElementById("lang-ar").onclick=function(){applyLang("ar");};
applyLang(LANG);
function replyAsk(t){
  t=(t||"").toLowerCase();
  var ar=LANG==="ar";
  if(!t.trim())return ar?"اكتب ما قالوه أو ما تراه.":"Write what they said or what you see.";
  if(/seed|mnemonic|private key|بذرة|مفتاح/.test(t))return ar?"لا تلصقها هنا. امح. غيّرها من جهازك.":"Do not paste that here. Wipe the box. Change it on YOUR device.";
  if(/install|apk|cleaner|ثبّت|نظّف/.test(t))return ar?"لا تثبّت. افتح تبويب الهاتف.":"Do not install. Open the phone tab.";
  if(/connect|wallet|اربط|محفظة/.test(t))return ar?"لا تربط. الصق توقيعاً عاماً فقط.":"Do not connect. Paste a public hash only.";
  if(/2fa|otp|كود/.test(t))return ar?"لا ترسل الكود. أغلق. غيّر كلمة السر من هذا الهاتف.":"Do not send the code. Hang up. Change the password on this phone.";
  if(/screen|remote|شاشة/.test(t))return ar?"لا تحكم عن بعد. أنت تضغط.":"No remote control. You tap.";
  if(/price|pay|سعر|ادفع/.test(t))return ar?"الأول مجاني. الزيادة بعد العمل إن طلبت.":"First pass is free. Extra only after work you asked for.";
  return ar?"اختر الهاتف أو الصق توقيعاً عاماً. تطبيق أو كود أو ربط من غريب = قف.":"Pick a phone tab or paste a public hash. App / code / connect from a stranger = stop.";
}
document.getElementById("askgo").onclick=function(){
  document.getElementById("askout").classList.add("on");
  document.getElementById("askrep").textContent=replyAsk(document.getElementById("askq").value);
};
</script>
</body>
</html>
