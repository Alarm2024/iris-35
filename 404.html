<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Not found · IRIS</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://iris-desk-voice.onrender.com; media-src https://iris-desk-voice.onrender.com; font-src 'self'; manifest-src 'self'; worker-src 'self'; connect-src 'self' https://api.mainnet-beta.solana.com https://solana-rpc.publicnode.com https://ethereum.publicnode.com https://mempool.space; form-action 'self'; base-uri 'none'; object-src 'none'; frame-src 'none'"/>
<meta name="referrer" content="no-referrer"/>
<meta name="theme-color" content="#0b1214"/>
<meta name="color-scheme" content="dark"/>
<link rel="icon" href="/favicon.ico" sizes="any"/>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="IRIS 35"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<link rel="stylesheet" href="/iris.css"/>
<style>
:root{--bg:#0b1214;--ink:#e8fbf6;--dim:#9ab3ad;--p:#2ee6c7;--g:#2ee6c7;--c:#7cf0dc;--l:rgba(46,230,199,.22);--card:#121a19;--warn:#f5d76e;--bad:#ff6b8a}
*{box-sizing:border-box;margin:0;padding:0}html,body{background:var(--bg);color:var(--ink)}
body{font-family:ui-sans-serif,system-ui,sans-serif;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:12px 16px 88px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;flex-wrap:nowrap}
.brand{display:flex;align-items:center;gap:8px}
.word{font-size:11px;letter-spacing:.32em;color:var(--dim)}
/* The header row as ui.js used to restyle it after first paint: one row of
   small pills. Set here so the page paints it that way from the start. */
.langs{display:flex;flex-wrap:nowrap;gap:3px;justify-content:flex-end;flex:1}
.langs button{border:1px solid var(--l);background:transparent;color:var(--dim);border-radius:999px;padding:5px 7px;font-size:10px;letter-spacing:.08em;cursor:pointer}
.langs button.on{color:#04110a;background:var(--g);border-color:var(--g)}
.lock-top{margin:4px auto 12px}
#desk{scroll-margin-top:72px}
/* Seven items share the header row on a phone. The theme label pushed it to
   405px on a 390px screen; the colour dot alone fits, and the menu still opens. */
@media(max-width:480px){#themeCur{display:none}}
/* Hold the theme button's slot in the row until themes.js adds it, so the
   language pills do not slide left when it arrives. */
.langs:not(:has(#themeMenu))::after{content:"";flex:0 0 89px}
@media(max-width:480px){.langs:not(:has(#themeMenu))::after{flex-basis:26px}}
.urgent-first{margin-bottom:8px}
.urgent-h{font-size:clamp(24px,6vw,30px);line-height:1.2;margin:4px 0 10px;letter-spacing:.02em}
.limits,.safety-note{border-radius:14px;padding:12px 14px;margin:10px 0;font-size:14px;line-height:1.5}
.limits{border:1px solid var(--l);background:var(--card);color:var(--dim)}
.limits h2{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--p);margin:0 0 8px}
.limits ul{margin:0;padding-inline-start:18px}
.limits li{margin:5px 0}
.safety-note{border:1px solid rgba(245,215,110,.45);background:rgba(245,215,110,.08);color:#f0e6c8}
.safety-note strong{color:var(--warn);font-weight:700;display:block;margin-bottom:4px;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.owner{margin:0 0 8px;letter-spacing:.2em;font-size:20px;color:var(--dim);text-align:center}
.hero{text-align:center;margin:8px 0 16px}
.tagline{font-size:clamp(17px,4.5vw,22px);line-height:1.45;margin:12px 0 6px;color:#e8fbf6;letter-spacing:.02em}
.tagline-foot{margin-top:18px;font-size:clamp(16px,4vw,20px);color:#e8fbf6;text-align:center}
.lock{position:relative;max-width:560px;margin:0 auto}
.lock img{width:100%;height:auto;display:block;border-radius:18px;border:1px solid var(--l);background:#0b1214}
.h1{font-size:22px;line-height:1.3;margin:14px 0 8px}
.lede,.hint,.love{color:var(--dim);font-size:15px}
.status{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--l);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--c);margin:8px 0}
.status i{width:7px;height:7px;border-radius:50%;background:var(--dim);display:inline-block;flex:0 0 auto}
.status.up i{background:var(--g)}.status.down i{background:var(--bad)}.status.down{color:var(--bad)}
.cta{display:inline-block;background:var(--g);color:#04110a;border-radius:999px;padding:12px 22px;font:700 15px inherit;text-decoration:none;margin:12px 0 4px}
.bullets{margin:14px 0;padding-inline-start:18px;color:var(--dim)}
.bullets li{margin:6px 0}
.how{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
.how div{border:1px solid var(--l);border-radius:14px;padding:12px 10px;background:var(--card)}
.how b{display:block;color:var(--c);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.how span{color:var(--dim);font-size:13px}
.love{margin-top:28px;font-size:16px;line-height:1.7;color:#e8fbf6}
h2{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--p);margin:22px 2px 8px}
.askgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 4px}
.askgrid button{text-align:start;border:1px solid var(--l);background:var(--card);color:var(--ink);border-radius:14px;padding:12px;font:600 13px inherit;cursor:pointer;min-height:52px}
.askgrid button small{display:block;color:var(--dim);font-weight:500;margin-top:4px}
.tabs{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}
.tabs button{flex:1;min-width:22%;border:1px solid var(--l);background:transparent;color:var(--ink);border-radius:999px;padding:12px 8px;font:600 13px inherit;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--g);color:#04110a;border-color:var(--g)}
.panel{display:none}.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--l);border-radius:16px;padding:16px;margin-top:12px}
.q{font-size:16px;margin-bottom:10px}
.ans{display:flex;flex-wrap:wrap;gap:8px}
.ans button{border:1px solid var(--l);background:#0f1918;color:var(--ink);border-radius:999px;padding:10px 14px;font:600 13px inherit;cursor:pointer;min-height:44px}
.ans button.on-no{border-color:var(--g);color:var(--g);background:rgba(46,230,199,.1)}
.ans button.on-yes{border-color:var(--bad);color:var(--bad);background:rgba(255,107,138,.1)}
.ans button.on-idk{border-color:var(--warn);color:var(--warn);background:rgba(245,215,110,.1)}
.badge{display:inline-block;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;letter-spacing:.1em;margin-bottom:8px;border:1px solid currentColor}
.A{color:#2ee6c7}.B{color:#f5d76e}.C{color:#ff6b8a}.X{color:#9ab3ad}
.rule{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;white-space:pre-wrap;word-break:break-word}
label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--p);margin-bottom:8px}
textarea,input[type=email],input[type=text]{width:100%;background:#0f1918;color:var(--ink);border:1px solid var(--l);border-radius:12px;padding:12px;font:14px inherit}
textarea{min-height:72px}
#q{font:13px ui-monospace,Menlo,Consolas,monospace;min-height:88px}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.go{background:var(--g);color:#04110a;border:0;border-radius:999px;padding:12px 16px;font:600 13px inherit;cursor:pointer;min-height:44px}
.ghost{background:transparent;border:1px solid var(--l);color:var(--ink);border-radius:999px;padding:12px 16px;font:600 13px inherit;cursor:pointer;min-height:44px}
.out{display:none;margin-top:12px}.out.on{display:block}
.later{margin-top:28px;padding-top:20px;border-top:1px solid var(--l)}
footer{margin-top:28px;color:var(--dim);font-size:14px;text-align:center;padding-top:8px;border-top:1px solid var(--l)}
footer .marks{letter-spacing:.2em;margin:10px 0;font-size:18px}
footer .marks-down{letter-spacing:.14em;margin-top:14px;font-size:17px}
footer .we-are{margin:10px 0;font-size:15px;color:#e8fbf6}
footer .made-by{margin-top:16px;font-size:15px;color:#f5d76e;letter-spacing:.04em}
footer .plumb-door{margin:12px 0;font-size:14px;line-height:1.55;opacity:.92}
footer .plumb-door a{font-weight:600}
footer .trust{margin-top:16px;padding-top:12px;border-top:1px solid var(--l);font-size:12px;line-height:1.55}
.addr{direction:ltr;unicode-bidi:isolate;margin-top:6px}
a{color:var(--c)}
.path{color:var(--g);font-size:12px;margin-bottom:6px}
@media(max-width:560px){.how{grid-template-columns:1fr}.askgrid{grid-template-columns:1fr}}
.voice{margin:4px 0 18px}
.talk-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;box-sizing:border-box;min-height:64px;margin:0 0 10px;padding:10px 20px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:linear-gradient(135deg,#0b1026,#1a2350);color:#fff;font-family:inherit;text-decoration:none;letter-spacing:.02em;touch-action:manipulation;-webkit-tap-highlight-color:transparent;box-shadow:0 6px 22px rgba(6,10,30,.45);transition:transform .1s ease,background .2s ease}
.talk-btn:hover{background:linear-gradient(135deg,#121a3a,#232e66);color:#fff}
.talk-btn:active{transform:scale(.98)}
.talk-btn:focus-visible{outline:3px solid #aab6ff;outline-offset:3px;border-radius:999px}
.talk-icon{font-size:26px;line-height:1}
.talk-text{display:flex;flex-direction:column;align-items:flex-start;text-align:start;line-height:1.2}
.talk-label{font-size:19px;font-weight:600;white-space:nowrap}
.talk-sub{font-size:12px;font-weight:400;opacity:.8}
.voice-hint{color:var(--dim);font-size:13px;text-align:center;margin:0 0 14px}
.demo{margin:0 0 12px}
.demo video{display:block;width:100%;height:auto;aspect-ratio:16/9;border-radius:18px;border:1px solid var(--l);background:#0b1214}
.demo figcaption{color:var(--dim);font-size:12px;letter-spacing:.08em;text-align:center;margin-top:6px}
@media(max-width:380px){.talk-label{font-size:17px}.talk-icon{font-size:23px}}
@media print{.voice{display:none}}
</style>
  <meta name="robots" content="noindex">
  <style>
    .nf{max-width:40rem;margin:12vh auto 16vh;padding:0 1rem;text-align:center}
    .nf h1{font-size:clamp(2rem,6vw,3rem);margin:0 0 .75rem}
    .nf p{margin:0 0 1.25rem;opacity:.85}
    .nf a.home{display:inline-block;padding:.7rem 1.2rem;border-radius:999px;border:1px solid currentColor;text-decoration:none;color:var(--accent,var(--g,#2ee6c7))}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top"><div class="brand" aria-label="IRIS 35">
      <img class="brand-mark" src="/mark-35.svg" width="42" height="42" alt="" decoding="async"/>
      <span class="word">IRIS</span>
    </div></div>
    <main id="main" class="nf">
      <h1>Page not found</h1>
      <p>That address is not on IRIS. It may have moved, or the link had a typo.</p>
      <p><a class="home" href="/">Back to IRIS</a></p>
    </main>
  </div>
</body>
</html>
