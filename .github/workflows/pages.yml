name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Build public site artifact
        run: |
          mkdir -p _site
          cp index.html app.js favicon.svg CNAME iris.css i18n.js lock.js addr.js boot.js _site/
          python3 - <<'PY'
          p="_site/index.html"
          t=open(p,encoding="utf-8").read()
          t=t.replace('<script src="app.js"></script>','<script src="i18n.js?v=9"></script>\n<script src="app.js?v=9"></script>\n<script src="boot.js?v=9"></script>')
          t=t.replace('<footer><a href="mailto:support@elghaly.dev">support@elghaly.dev</a></footer>','<footer><a href="mailto:support@elghaly.dev">support@elghaly.dev</a><p class="addr" dir="ltr">548 Market Street, San Francisco, California 94104</p><p class="addr" dir="ltr">35 Zamalek, Cairo, Egypt</p></footer>')
          open(p,"w",encoding="utf-8").write(t)
          PY
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
