name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Build public site artifact
        run: |
          mkdir -p _site
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core python3-pil
          cp index.html app.js favicon.svg CNAME iris.css gate.js lock.js i18n.js addr.js _site/
          python3 make_logo.py || true
          python3 - <<'PY'
          p="_site/index.html"
          t=open(p,encoding="utf-8").read()
          t=t.replace('<script src="app.js"></script>','<script src="i18n.js"></script>\n<script src="app.js"></script>\n<script src="lock.js"></script>\n<script src="addr.js"></script>')
          open(p,"w",encoding="utf-8").write(t)
          PY
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
